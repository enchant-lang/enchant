<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>enchant · repl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* CARI's archive (dossier.design.cari): white paper, black ink, gray index
   bars, one green action. Pictograms name the kinds of things. */
:root{color-scheme:light;
  --paper:#ffffff;--card:#fdfdfd;--field:#f5f5f5;--inset:#f0f0f0;--soft:#e7e7e7;--line:#cdcdcd;--edge:#b9b9b9;
  --ink:#000;--ink2:#333;--muted:#5f5f5f;--go:#51ae39;--go-ink:#fff;--go-bg:#eaf5e7;--ok:#3f8a2c;
  --wait:#9a6a00;--wait-bg:#fff4d9;--bad:#990000;--bad-bg:#f7e6e6;
  --k-kw:#7a3e9d;--k-atom:#1d5fa8;--k-str:#3f7a2c;--k-num:#a14d00;--k-cmt:#8a8a8a;--k-def:#000;--k-std:#2b5b84;
  --p0:#7a3e9d;--p1:#1d5fa8;--p2:#0f7a6c;--p3:#a14d00;--p4:#b0306a;--p5:#4d7a12;
  --sans:Epilogue,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:clamp(16px,3.2vw,40px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --paper:#0b0b0b;--card:#141414;--field:#1b1b1b;--inset:#202020;--soft:#262626;--line:#333;--edge:#444;
  --ink:#f2f2f2;--ink2:#c9c9c9;--muted:#9d9d9d;--go:#7ed957;--go-ink:#0b0b0b;--go-bg:#1c2a18;--ok:#7ed957;
  --wait:#e0a640;--wait-bg:#2e2414;--bad:#ff6b6b;--bad-bg:#301616;
  --k-kw:#d2a8ff;--k-atom:#79c0ff;--k-str:#a5d6a7;--k-num:#ffb86b;--k-cmt:#7d7d7d;--k-def:#fff;--k-std:#9ecbff;
  --p0:#d2a8ff;--p1:#79c0ff;--p2:#7ee0d0;--p3:#ffcb6b;--p4:#ff9ac1;--p5:#c3e88d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);height:100dvh;display:flex;flex-direction:column;min-width:300px;overflow:hidden}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 10px;min-height:32px;cursor:pointer}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.go{background:var(--go);border-color:var(--go);color:var(--go-ink);font-weight:600}
.go:hover:not(:disabled){background:var(--go);filter:brightness(1.06)}
.ib{width:32px;padding:0;display:inline-grid;place-items:center}
.mono{font-family:var(--mono)}
/* ── header ── */
header{display:flex;align-items:center;gap:12px;padding:10px var(--gut);border-bottom:1px solid var(--line);min-height:52px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.3px}
.disc{width:14px;height:14px;border-radius:50%;background:var(--ink);flex:none}
.disc[data-state=connecting]{background:var(--edge)}
.disc[data-state=offline]{background:var(--bad)}
.disc[data-state=busy]{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#where{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .spacer{flex:1}
#railtabs{display:none;gap:6px}
/* ── layout ── */
#app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px)}
#work{display:flex;flex-direction:column;min-height:0;min-width:0}
#log{flex:1;min-height:0;overflow-y:auto;padding:18px var(--gut) 8px;font:13px/1.65 var(--mono)}
.entry{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:0 10px;padding:6px 0;border-bottom:1px solid var(--inset)}
.entry .n{color:var(--muted);font-size:11px;text-align:right;padding-top:2px;user-select:none}
.entry .b{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry.linked{background:linear-gradient(90deg,var(--go-bg),transparent 60%)}
.entry.linked .n{color:var(--go);font-weight:600}
.src{color:var(--ink)}.src .ns{color:var(--muted)}
.val{color:var(--ink2)}.val::before{content:"⇒ ";color:var(--muted)}
.err{color:var(--bad)}.out{color:var(--muted)}
.meta{color:var(--muted);font-size:11px}
.more{color:var(--muted);cursor:pointer;text-decoration:underline dotted}
.entry .tasklink{color:var(--go);cursor:pointer;font-family:var(--sans);font-size:12px;margin-left:8px}
#empty{color:var(--line);font:600 64px/1 var(--sans);text-align:center;margin-top:16vh;user-select:none}
#empty[hidden]{display:none}
/* ── composer ── */
#composer{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px var(--gut) 12px}
#prompt-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--edge);border-radius:4px;background:var(--paper);padding:9px 10px;max-height:34vh;overflow:auto}
#prompt-row:focus-within{border-color:var(--ink)}
#prompt-label{font:13px/1.6 var(--mono);color:var(--muted);white-space:nowrap;user-select:none;cursor:text}
#editor-wrap{flex:1;min-width:0}
#gutter{font:12px/1.5 var(--mono);color:var(--muted);min-height:20px;padding:6px 2px 0;display:flex;gap:10px;align-items:baseline;overflow:hidden;white-space:nowrap}
#gutter .clause{color:var(--muted)}#gutter .clause.fits{color:var(--ink2)}
#gutter .cur{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
#gutter .nsname{color:var(--muted);font-size:11px}
#gutter .doc{font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#gutter .smell{color:var(--wait);font-family:var(--sans)}
#offer{display:none;margin-top:8px;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:8px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;color:var(--ink2)}
#offer.on{display:block}
#offer .row{display:flex;gap:8px;margin-top:8px;font-family:var(--sans)}
#actions{display:flex;align-items:center;gap:8px;margin-top:8px}
#actions .spacer{flex:1}
#state{font-size:12px;color:var(--muted)}
/* ── editor ── */
.cm-editor{background:transparent;font-size:13px;line-height:1.6}.cm-editor.cm-focused{outline:none}
.cm-content{padding:0;caret-color:var(--ink);font-family:var(--mono)}.cm-scroller{overflow:visible;font-family:var(--mono)}
.cm-editor .cm-gutters{display:none!important}.cm-editor .cm-activeLine{background:transparent!important}
.cm-cursor{border-left:2px solid var(--ink)!important}
.cm-selectionBackground,.cm-editor ::selection{background:var(--soft)!important}
.cm-editor .cm-matchingBracket{background:var(--soft);outline:1px solid var(--edge)}
.cm-content .cm-paren-0{color:var(--p0)}.cm-content .cm-paren-1{color:var(--p1)}.cm-content .cm-paren-2{color:var(--p2)}
.cm-content .cm-paren-3{color:var(--p3)}.cm-content .cm-paren-4{color:var(--p4)}.cm-content .cm-paren-5{color:var(--p5)}
.cm-ghost{color:var(--muted);opacity:.55;pointer-events:none}
.cm-smell{text-decoration:underline dotted var(--wait) 2px;text-underline-offset:4px}
.cm-tooltip{background:var(--card)!important;color:var(--ink);border:1px solid var(--edge)!important;border-radius:4px;font:12px/1.5 var(--sans)}
.smell-tip{padding:8px 11px;max-width:min(440px,86vw);line-height:1.5}
.smell-tip b{font:600 12px var(--mono);color:var(--wait)}.smell-tip code{font-family:var(--mono);background:var(--inset);padding:0 3px;border-radius:3px}
.cm-tooltip-autocomplete{box-shadow:0 8px 24px #0002}
.cm-tooltip-autocomplete ul{font:12.5px var(--mono)!important;max-height:16em!important}
.cm-tooltip-autocomplete ul li{padding:4px 10px!important;display:flex;align-items:baseline;gap:8px}
.cm-tooltip-autocomplete ul li[aria-selected]{background:var(--soft)!important;color:var(--ink)!important}
.cm-completionDetail{font:11.5px var(--sans);color:var(--muted);font-style:normal!important;margin-left:auto!important;overflow:hidden;text-overflow:ellipsis;max-width:26em}
.cm-tooltip-autocomplete completion-section{display:block;font:600 10.5px var(--sans)!important;letter-spacing:.06em;text-transform:lowercase;color:var(--muted)!important;background:var(--soft)!important;border-bottom:1px solid var(--line)!important;padding:3px 10px!important;opacity:1!important}
.cm-completionIcon{display:none}
/* ── the rail: shelf and tiles ── */
#rail{border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:12px 14px 20px;background:var(--paper)}
.bar{display:flex;align-items:center;gap:6px;font:600 12.5px var(--sans);text-transform:lowercase;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin:6px 0 8px}
.bar .count{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
#shelf .none,#tiles .none{font-size:12px;color:var(--muted);padding:2px 2px 8px}
.spec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 9px;align-items:center;width:100%;text-align:left;padding:7px 8px;min-height:44px;border:1px solid transparent;background:none;border-radius:4px}
.spec:hover{background:var(--field);border-color:var(--line)}
.tile-ab{grid-row:span 2;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:3px;display:grid;place-items:center;font:600 11.5px var(--mono);text-transform:lowercase;background:var(--card)}
.spec .t1{font:500 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec .t2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:8px 10px;margin:0 0 8px;cursor:pointer}
.task:hover{border-color:var(--edge)}
.task.hot{outline:2px solid var(--go)}
.task .top{display:flex;align-items:center;gap:7px;font:500 12.5px var(--mono)}
.task .top .st{margin-left:auto;font:11px var(--sans);color:var(--muted)}
.task .goal{font-size:12.5px;color:var(--ink2);margin:3px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .from{font-size:11px;color:var(--muted);margin-top:4px}
.task .kept{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.task .kept button{min-height:26px;font:11.5px var(--mono);padding:0 7px}
.mark{font-family:var(--mono);width:1.1em;text-align:center}
.mark.running{color:var(--go)}.mark.needs{color:var(--wait)}.mark.done{color:var(--ok)}.mark.failed{color:var(--bad)}.mark.idle{color:var(--muted)}
/* ── the drawer: a record or a transcript ── */
#drawer{visibility:hidden;transition:transform .16s ease-out,visibility 0s linear .16s;position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);border-left:1px solid var(--edge);box-shadow:-12px 0 32px #0000001a;transform:translateX(102%);display:flex;flex-direction:column;z-index:20}
#drawer.open{transform:none;visibility:visible;transition:transform .16s ease-out}
#drawer .dhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
#drawer .dhead .title{font:600 15px var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .dhead .sub{font-size:11.5px;color:var(--muted)}
#drawer .dbody{flex:1;overflow-y:auto;padding:12px 16px 24px}
#drawer .dfoot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;background:var(--card)}
#drawer .dfoot input{flex:1;min-width:0;font:13px var(--mono);border:1px solid var(--edge);border-radius:4px;padding:6px 8px;min-height:34px;background:var(--paper);color:var(--ink)}
.chips{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 10px}
.chips button{border:0;background:none;border-radius:0;padding:4px 0 6px;min-height:30px;font-size:12.5px;color:var(--muted);text-transform:lowercase}
.chips button:hover:not(:disabled){background:none;color:var(--ink)}
.chips button.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.gloss{color:var(--ink2);margin:2px 0 10px}
.path{font:11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pub{display:grid;grid-template-columns:minmax(0,1fr);width:100%;text-align:left;border:0;border-bottom:1px solid var(--inset);border-radius:0;background:none;padding:7px 2px;min-height:44px}
.pub:hover{background:var(--field)}
.pub .nm{font:500 13px var(--mono)}.pub .al{font:11.5px var(--mono);color:var(--muted);margin-left:8px}
.pub .dc code,.gloss code{font-size:11.5px;background:var(--inset);padding:0 3px;border-radius:3px}
.pub .dc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--inset);font-size:12.5px}
.row .k{color:var(--muted);text-transform:lowercase}
.row .v{font-family:var(--mono);overflow-wrap:anywhere}
pre.code{font:12.5px/1.6 var(--mono);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 11px;overflow-x:auto;margin:6px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
pre.result{font:12.5px/1.6 var(--mono);color:var(--ink2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.doc-prose code{background:var(--inset);padding:0 3px;border-radius:3px;font-size:12px}
.doc-prose{font-size:13.5px;line-height:1.6;color:var(--ink2);margin:6px 0 10px;white-space:pre-wrap}
.callers .c{font:12px var(--mono);padding:4px 0;border-bottom:1px solid var(--inset);overflow-wrap:anywhere}
.callers .c span{color:var(--muted)}
.kept-row{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.kept-row button{font:12px var(--mono);min-height:28px}
table.org{border-collapse:collapse;font:12px var(--mono);margin:4px 0 12px;width:100%}
table.org td,table.org th{border:1px solid var(--line);padding:3px 7px;text-align:left;vertical-align:top}
table.org th{background:var(--soft);font-weight:600}
.empty-note{color:var(--muted);font-size:12.5px;padding:8px 0}
/* ── phone ── */
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #rail{display:none;border-left:0}
  body.show-rail #rail{display:block}
  body.show-rail #work{display:none}
  #railtabs{display:flex}
  #railtabs button.on{background:var(--soft);border-color:var(--edge)}
  #where{max-width:40vw}
  #log{padding:12px 16px 6px}
  .entry{grid-template-columns:1.9em minmax(0,1fr);gap:0 6px}
  #composer{padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  #gutter .doc{display:none}
  #drawer .dhead,#drawer .dbody,#drawer .dfoot{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="disc" id="disc" data-state="connecting" role="img" aria-label="connecting"></span><span>enchant</span></div>
  <span id="where" title="namespace · session"></span>
  <span class="spacer"></span>
  <div id="railtabs" role="tablist">
    <button type="button" class="ib on" id="tab-work" aria-label="prompt" title="prompt">λ</button>
    <button type="button" id="tab-rail" aria-label="shelf and tasks" title="shelf and tasks"><span id="tab-rail-label">▢ 0 · ○ 0</span></button>
  </div>
</header>
<div id="app">
  <section id="work">
    <main id="log" role="log" aria-label="history" aria-live="polite"><div id="empty" aria-hidden="true">λ</div></main>
    <div id="composer">
      <div id="prompt-row"><span id="prompt-label">user=&gt;</span><div id="editor-wrap" aria-label="prompt"></div></div>
      <div id="gutter" aria-live="polite"></div>
      <div id="offer" role="status"></div>
      <div id="actions">
        <span id="state" role="status"></span><span class="spacer"></span>
        <button type="button" id="interrupt" class="ib" disabled title="stop the evaluation" aria-label="stop">■</button>
        <button type="button" id="run" class="go" disabled title="evaluate · Enter" aria-label="evaluate">▶</button>
      </div>
    </div>
  </section>
  <aside id="rail" aria-label="shelf and tasks">
    <div class="bar"><span aria-hidden="true">▢</span> shelf <span class="count" id="shelf-count">0</span></div>
    <div id="shelf"></div>
    <div class="bar"><span aria-hidden="true">●</span> tasks <span class="count" id="tile-count">0</span></div>
    <div id="tiles"></div>
  </aside>
</div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead"><button type="button" class="ib" id="dback" aria-label="back" title="back">←</button><div style="min-width:0;flex:1"><div class="title" id="dtitle"></div><div class="sub" id="dsub"></div></div><span id="dact"></span><button type="button" class="ib" id="dclose" aria-label="close" title="close · Esc">×</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot" hidden></div>
</aside>
<script>
window.addEventListener('error', e => { try{ localStorage.setItem('bl-repl-err', (e.message||'?') + ' @' + (e.filename||'') + ':' + e.lineno); }catch(_){}});
window.addEventListener('unhandledrejection', e => { try{ localStorage.setItem('bl-repl-err', 'reject: ' + (e.reason && e.reason.message || e.reason)); }catch(_){}});
</script>
<script type="module">
const BL_TOKEN = __BL_TOKEN__;
import {EditorView, basicSetup, keymap, autocompletion, startCompletion, closeCompletion, currentCompletions, selectedCompletionIndex, completionStatus, StreamLanguage, syntaxHighlighting, HighlightStyle, tags, clojure, insertNewlineAndIndent, ViewPlugin, Decoration, WidgetType, hoverTooltip, RangeSetBuilder, Prec} from "/repl/editor.bundle.js?v=3";

const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(_){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}};

// ── the scanner the balance gate, the ghosts and the gutter share ──
// Strings and `;` comments are text, not structure (BUG-087 pinned the server
// side; `balanced` is still checked against it by the `balanced` op).
function scan(src){
  const stack=[]; let str=false,esc=false,comment=false,stray=false;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(comment){ if(ch==="\n")comment=false; continue; }
    if(esc){ esc=false; continue; }
    if(str){ if(ch==="\\")esc=true; else if(ch==='"')str=false; continue; }
    if(ch==='"'){str=true;continue;}
    if(ch===";"){comment=true;continue;}
    if(ch==="("||ch==="["||ch==="{") stack.push({ch,at:i});
    else if(ch===")"||ch==="]"||ch==="}"){
      const want={")":"(","]":"[","}":"{"}[ch];
      if(!stack.length||stack[stack.length-1].ch!==want){ stray=true; }
      else stack.pop();
    }
  }
  return {stack,str,stray};
}
const CLOSE={"(":")","[":"]","{":"}"};
function balanced(src){ const s=scan(src); return !s.str && !s.stray && s.stack.length===0; }
function ghosts(src){ const s=scan(src); if(s.str||s.stray) return ""; return s.stack.map(o=>CLOSE[o.ch]).reverse().join(""); }

// ── the socket ──
let ws, seq=0, pending=new Map(), session=null, curNs="user", activeEval=null;
const SURFACE=new Set(["namespaces","shelf","record","tiles","transcript","smells","repair","completions","doc","balanced"]);
function connected(){ return ws?.readyState===WebSocket.OPEN && !!session; }
function setDisc(state,label){ const d=el("disc"); d.dataset.state=state; d.setAttribute("aria-label",label); d.title=label; }
function connect(){
  setDisc("connecting","connecting");
  const stored=store.get("bl-repl-session","");
  ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/repl/ws?token=${encodeURIComponent(BL_TOKEN)}${stored?`&session=${encodeURIComponent(stored)}`:""}`);
  ws.onclose=()=>{
    for(const [,p] of pending){ if(p.entry) add(p.entry,"err","connection lost before the evaluation completed"); else p.resolve?.(null); }
    pending.clear(); activeEval=null; session=null;
    setDisc("offline","disconnected · retrying"); refreshState();
    setTimeout(connect,1000);
  };
  ws.onmessage=ev=>onMessage(JSON.parse(ev.data));
}
function onMessage(m){
  if(m.kind==="hello"){
    const prev=session; session=m.session; curNs=m.ns; showNs(); setDisc("online","connected");
    if(m.reattached) note(`reattached to ${session}: definitions and namespace kept`);
    else if(prev&&prev!==session) note(`new session ${session}: the previous one is gone`);
    store.set("bl-repl-session",session);
    refreshState(); refreshShelf(); refreshTiles(); return;
  }
  const p=pending.get(m.id), entry=p?.entry, rtt=p?Math.round(performance.now()-p.t0):null;
  if(m.kind==="out"){ addLong(entry,"out",m.text); return; }

function rpc(op,fields={},entry=null){

function showNs(){ el("where").textContent=`${curNs} · ${session||"…"}`; el("prompt-label").textContent=`${curNs}=>`; }

// ── history ──
let entryN=store.get("bl-repl-entry-n",0);

function newEntry(src){

  const d=document.createElement("div"); d.className="entry"; d.id=`e${n}`; d.dataset.n=n;
  d.innerHTML=`<span class="n">${n}</span><div class="b"><span class="src"><span class="ns">${esc(curNs)}=&gt;</span> ${esc(src)}</span></div>`;
  el("log").appendChild(d); scrollLog(); return d;
}
function note(text){ el("empty").hidden=true; const d=document.createElement("div"); d.className="entry"; d.innerHTML=`<span class="n"></span><div class="b meta">${esc(text)}</div>`; el("log").appendChild(d); scrollLog(); }

  const a=document.createElement("span"); a.className="tasklink"; a.tabIndex=0; a.textContent=`● ${m[1]}`;

// ── eval: the prompt, and the forms the panels write for you ──
const hist=store.get("bl-repl-hist",[]); let histIx=-1;
const queue=[];

}

// ── Enter: run, close what is open at the end, or offer ──
async function onEnter(v){
  const src=v.state.doc.toString();
  if(!src.trim()) return true;
  const pos=v.state.selection.main.head;
  if(pos<src.trimEnd().length && !balanced(src)) return insertNewlineAndIndent(v);   // editing inside: a newline
  if(balanced(src)){ submit(src); return true; }
  const r=await ask("repair",{src});
  if(!r){ return insertNewlineAndIndent(v); }
  if(r.reads){ submit(src); return true; }
  if(r.auto){ setDoc(r.src); submit(r.src); return true; }
  offer(r); return true;
}
function offer(r){
  const o=el("offer");

  o.classList.add("on");

  el("offer-apply")?.addEventListener("click",()=>{ setDoc(r.src); offer(null); view.focus(); });
  el("offer-dismiss").addEventListener("click",()=>{ offer(null); view.focus(); });
}

// ── ghost closers ──
class Ghost extends WidgetType{

const ghostPlugin=ViewPlugin.fromClass(class{
  constructor(v){ this.decorations=this.build(v); }

// ── rainbow parens: a closer takes its opener's depth ──
function parenSpans(text){
  const spans=[]; let depth=0,inStr=false,e=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inStr){ if(e) e=false; else if(ch==="\\") e=true; else if(ch==='"') inStr=false; continue; }
    if(ch===';'){ while(i<text.length&&text[i]!=="\n") i++; continue; }
    if(ch==='"'){ inStr=true; continue; }
    if(ch==="("||ch==="["||ch==="{"){ spans.push([i,i+1,depth%6]); depth++; continue; }
    if(ch===")"||ch==="]"||ch==="}"){ depth=Math.max(0,depth-1); spans.push([i,i+1,depth%6]); }
  }
  return spans;
}
const rainbow=ViewPlugin.fromClass(class{
  constructor(v){ this.decorations=this.build(v); }
  update(u){ if(u.docChanged||u.viewportChanged) this.decorations=this.build(u.view); }
  build(v){ const b=new RangeSetBuilder(); for(const [f,t,d] of parenSpans(v.state.doc.toString())) b.add(f,t,Decoration.mark({class:"cm-paren-"+d})); return b.finish(); }
},{decorations:v=>v.decorations});

// ── smells: the harness's advice, on the form you are typing ──
let smells=[];      // [{from,to,smell,message,suggest,allowed}]
const smellMarks=ViewPlugin.fromClass(class{
  constructor(v){ this.decorations=Decoration.none; }
  update(u){ this.decorations=this.build(u.view); }
  build(v){ const b=new RangeSetBuilder(); for(const s of [...smells].sort((a,b)=>a.from-b.from)) if(s.to<=v.state.doc.length&&!s.allowed) b.add(s.from,s.to,Decoration.mark({class:"cm-smell"})); return b.finish(); }
},{decorations:v=>v.decorations});
const smellTip=hoverTooltip((v,pos)=>{
  const s=smells.find(s=>pos>=s.from&&pos<=s.to); if(!s) return null;
  return {pos:s.from,end:s.to,above:true,create(){ const d=document.createElement("div"); d.className="smell-tip"; d.innerHTML=smellHtml(s); return {dom:d}; }};
});
function smellHtml(s){ return `<b>▲ ${esc(s.smell)}</b><div>${esc(s.message)}</div>${s.suggest?`<div style="margin-top:4px">→ <code>${esc(s.suggest)}</code></div>`:""}`; }
let smellTimer=null, smellSeq=0;
function checkSmells(){
  clearTimeout(smellTimer);
  smellTimer=setTimeout(async ()=>{
    const src=view.state.doc.toString(), mine=++smellSeq;
    if(!src.includes("sleep")){ setSmells([]); return; }     // the one advice rule today watches sleeps
    const fs=await ask("smells",{src});
    if(mine!==smellSeq||!fs) return;
    const lines=src.split("\n"), starts=[0]; for(const l of lines) starts.push(starts[starts.length-1]+l.length+1);
    setSmells(fs.map(f=>{ const line=lines[f.line-1]||"", col=Math.max(0,line.indexOf(f.form||"")); const from=starts[f.line-1]+col; return {...f,from,to:from+Math.max(1,(f.form||line).length)}; }));
  },450);
}
function setSmells(s){ smells=s; view.dispatch({}); updateGutter(); }

// ── the gutter: the arglists of the call you are in ──
const docCache=new Map();
function callAt(text,pos){
  const before=text.slice(0,pos), s=scan(before);

  if(!open) return null;
  const inner=before.slice(open.at+1);
  const head=/^([^\s()\[\]{}"';]+)/.exec(inner); if(!head) return null;
  let i=head[1].length, depth=0, n=0, inTok=false, str=false, e=false;
  for(;i<inner.length;i++){
    const ch=inner[i];
    if(str){ if(e) e=false; else if(ch==="\\") e=true; else if(ch==='"') str=false; continue; }
    if(depth===0 && /\s/.test(ch)){ inTok=false; continue; }
    if(depth===0 && !inTok){ n++; inTok=true; }
    if(ch==='"') str=true; else if("([{".includes(ch)) depth++; else if(")]}".includes(ch)) depth--;
  }
  return {name:head[1], arg:inTok?n-1:n};
}
async function docOf(name){
  const key=`${curNs}|${name}`;

  const r=await rpc("doc",{ns:"auto",name});
  const v=r&&(r.doc||r.arglists)?{ns:r.ns,name:r.name,arglists:r.arglists||"",doc:r.doc||""}:null;
  docCache.set(key,v); return v;
}
function clauseHtml(clause,arg){
  const parts=clause.replace(/^\(|\)$/g,"").split(/\s+/); const name=parts.shift(); const rest=parts.indexOf("&");
  const fits=rest>=0?arg>=0:arg<parts.length;
  const cells=parts.map((p,i)=>{ const cur=(rest>=0&&i>rest&&arg>=rest)||(i===arg&&p!=="&"); return cur?`<span class="cur">${esc(p)}</span>`:esc(p); });
  return `<span class="clause${fits?" fits":""}">(${esc(name)}${cells.length?" "+cells.join(" "):""})</span>`;
}
let gutterSeq=0;
async function updateGutter(){
  const mine=++gutterSeq, g=el("gutter");

  if(smell){ g.innerHTML=`<span class="smell">▲ ${esc(smell.smell)} · ${esc(smell.message.split(". ")[0])}</span>`; return; }
  if(completionStatus(st)==="active"){
    const cs=currentCompletions(st), ix=selectedCompletionIndex(st), c=ix!=null?cs[ix]:null;
    if(c?.gloss!=null){ g.innerHTML=`<span class="doc">${esc(c.gloss||"")}</span>`; return; }
    if(c?.item){ g.innerHTML=gutterHtml(c.item.label,c.item.ns,c.item.arglists,c.item.doc,-1); return; }
  }
  const call=callAt(st.doc.toString(),pos);
  if(!call){ g.innerHTML=""; return; }
  const d=await docOf(call.name);

  g.innerHTML=gutterHtml(call.name,d.ns,d.arglists,d.doc,call.arg);
}
function gutterHtml(name,ns,arglists,doc,arg){
  const clauses=(arglists||"").match(/\([^()]*\)/g);
  const args=clauses?clauses.map(c=>clauseHtml(c,arg)).join(" "):(arglists?`<span class="clause fits">${esc(name)} · ${esc(arglists)}</span>`:`<span class="clause fits">${esc(name)}</span>`);
  const first=(doc||"").split("\n")[0];

// ── completion: names in call position, namespaces inside a require ──
let nsList=null, nsAt=0;
async function namespaces(){
  if(nsList && performance.now()-nsAt<8000) return nsList;
  nsList=await ask("namespaces",{})||nsList||[]; nsAt=performance.now(); return nsList;
}
const KIND={here:{name:"path",rank:0},lib:{name:"lib",rank:1},std:{name:"std",rank:2},compat:{name:"compat",rank:3}};
function abbr(ns){ const s=ns.split(".").filter(Boolean); return s.length<2?ns.replace(/[^a-z0-9]/gi,"").slice(0,2):(s[0][0]+s[s.length-1][0]); }
const NS_RE=/\((?:require\s+'?|ns\s+\S+\s+\(:require\s+(?:[^()]*?\s)?)\[([A-Za-z0-9_.\-]*)$/;
const AFTER_NS_RE=/\(require\s+'?\[([A-Za-z0-9_.\-]+)\s+(:?[a-z\-]*)$/;
async function completeSource(ctx){
  const before=ctx.state.doc.sliceString(Math.max(0,ctx.pos-200),ctx.pos);
  const after=AFTER_NS_RE.exec(before);
  if(after){
    const word=ctx.matchBefore(/:?[a-z\-]*$/);
    const ns=after[1], ab=abbr(ns);
    return {from:word.from, filter:true, options:[
      {label:`:as ${ab}`, detail:"alias", apply:`:as ${ab}]`, gloss:`alias it as ${ab}: (${ab}/…)`},
      {label:":refer [", detail:"names", apply:":refer [", gloss:"bring named publics into this namespace"},
      {label:":reload", detail:"load again", apply:":reload]", gloss:"load the source again, even if loaded"}]};
  }
  const m=NS_RE.exec(before);
  if(m){
    const all=await namespaces();
    return {from:ctx.pos-m[1].length, validFor:/^[A-Za-z0-9_.\-]*$/,
      options:all.map(n=>({label:n.ns, detail:(n.loaded?"● ":"")+(n.gloss||""), gloss:n.gloss||"", section:KIND[n.kind]||KIND.here, boost:n.loaded?1:0}))};
  }
  const word=ctx.matchBefore(/[A-Za-z0-9_\-.!*+?/<>=$]+$/);
  if(!word) return null;
  const callPos=word.from>0&&/[(]/.test(ctx.state.doc.sliceString(word.from-1,word.from));
  if(!ctx.explicit && (word.text.length<2 || !callPos)) return null;
  const r=await rpc("complete",{prefix:word.text});
  if(!r||ctx.aborted) return null;
  return {from:word.from, validFor:/^[A-Za-z0-9_\-.!*+?/<>=$]*$/,
    options:r.items.map(i=>({label:i.label, detail:i.arglists&&!i.arglists.startsWith("arities")?i.arglists:i.ns, item:i}))};
}

const MARK={running:["●","running"],done:["✓","done"],failed:["×","failed"],crashed:["×","failed"],"step-limit":["◐","needs"],stopped:["○","idle"],idle:["○","idle"]};
function mark(status){ const [m,c]=MARK[status]||["○","idle"]; return `<span class="mark ${c}" aria-label="${esc(status)}">${m}</span>`; }

      <div class="top">${mark(t.status)}<span>${esc(t.task)}</span><span class="st">${esc(t.status==="step-limit"?"needs you":t.status)} · ${t.turns||0} turn${t.turns===1?"":"s"}</span></div>
      ${t.goal?`<div class="goal">${esc(t.goal)}</div>`:""}
      ${origins[t.task]?`<div class="from">─ from ${esc(curNs)}:${origins[t.task]}</div>`:t.origin?`<div class="from">from ${esc(t.origin)}</div>`:""}
      ${t.kept.length?`<div class="kept">${t.kept.map(k=>`<button type="button" data-rerun="${esc(k)}" title="run again">↻ ${esc(k)}</button>`).join("")}</div>`:""}
    </div>`).join(""):`<div class="none">no tasks · <span class="mono">(task "…")</span></div>`;

  el("dback").hidden=!trail.length;
}
function closeDrawer(){ el("drawer").classList.remove("open"); el("drawer").setAttribute("aria-hidden","true"); drawerKind=null; trail.length=0; view.focus(); }
el("dclose").onclick=closeDrawer;
el("dback").onclick=()=>{ const t=trail.pop(); if(!t) return closeDrawer(); const [k,a]=t; drawerKind=null; k==="record"?openRecord(...a,false):k==="transcript"?openTranscript(a,false,false):null; };
document.addEventListener("keydown",e=>{ if(e.key!=="Escape"||!drawerKind||e.defaultPrevented) return; if(view.hasFocus&&(completionStatus(view.state)||el("offer").classList.contains("on"))) return; closeDrawer(); });

async function openRecord(ns,name=null,push=true){
  openDrawer("record",[ns,name],esc(name?`${ns}/${name}`:ns),"reading…","",null,push);
  const r=await ask("record",{ns,name:name||""});
  if(!r){ el("dbody").innerHTML=`<div class="empty-note">no record for ${esc(ns)}</div>`; return; }
  const onShelf=shelfRows.find(s=>s.ns===ns);
  if(!name){
    el("dtitle").innerHTML=`<span class="tile-ab" style="display:inline-grid;vertical-align:middle;margin-right:8px;width:30px;height:30px">${esc(onShelf?.alias&&onShelf.alias.length<=3?onShelf.alias:abbr(ns))}</span>${esc(ns)}`;
    el("dsub").textContent=`${r.kind==="here"?"path":r.kind} · ${r.publics.length} public${r.loaded?"":" · not loaded"}`;
    const tabs=["publics","used by","tests"];
    const panes={
      "publics":r.publics.length?r.publics.map(p=>`<button type="button" class="pub" data-name="${esc(p.name)}"><span><span class="nm">${esc(p.name)}</span><span class="al">${esc(shortArgs(p.arglists))}</span></span>${p.doc?`<span class="dc">${inline(p.doc)}</span>`:""}</button>`).join(""):`<div class="empty-note">no public names</div>`,
      "used by":r.usedBy.length?r.usedBy.map(u=>`<button type="button" class="pub" data-ns="${esc(u)}"><span class="nm">${esc(u)}</span></button>`).join(""):`<div class="empty-note">no loaded namespace requires it</div>`,
      "tests":r.tests.length?r.tests.map(t=>`<div class="row"><span class="k">test</span><span class="v">${esc(t)}</span></div>`).join(""):`<div class="empty-note">no test file named after it</div>`,
    };
    el("dbody").innerHTML=`${r.gloss?`<p class="gloss">${esc(r.gloss)}</p>`:""}${r.path?`<div class="path" title="${esc(r.path)}">${esc(shortPath(r.path))}</div>`:""}
      <div class="chips" role="tablist">${tabs.map((t,i)=>`<button type="button" data-tab="${t}" class="${i?"":"on"}">${t} · ${t==="publics"?r.publics.length:t==="used by"?r.usedBy.length:r.tests.length}</button>`).join("")}</div><div id="pane">${panes.publics}</div>`;
    const wire=()=>{ for(const b of el("dbody").querySelectorAll(".pub[data-name]")) b.onclick=()=>openRecord(ns,b.dataset.name);
                     for(const b of el("dbody").querySelectorAll(".pub[data-ns]")) b.onclick=()=>openRecord(b.dataset.ns); };
    for(const c of el("dbody").querySelectorAll(".chips button")) c.onclick=()=>{ for(const x of el("dbody").querySelectorAll(".chips button")) x.classList.toggle("on",x===c); el("pane").innerHTML=panes[c.dataset.tab]; wire(); };
    wire();
    if(!onShelf){ el("dact").innerHTML=`<button type="button" class="go" id="req">require</button>`; el("req").onclick=()=>{ evalForm(`(require '[${ns} :as ${abbr(ns)}])`); closeDrawer(); }; }
  } else {
    const ab=onShelf?.alias, q=ab?`${ab}/${name}`:(onShelf?.refers.includes(name)?name:`${ns}/${name}`);
    el("dsub").textContent=r.path?`${shortPath(r.path)}${r.line?":"+r.line:""}`:ns; el("dsub").title=r.path||"";
    el("dbody").innerHTML=`${r.arglists?`<div class="row"><span class="k">call</span><span class="v">${esc(r.arglists)}</span></div>`:""}
      ${r.doc?`<div class="doc-prose">${inline(dedent(r.doc))}</div>`:`<div class="empty-note">no docstring</div>`}
      <div class="bar">source</div>${r.source?`<pre class="code">${esc(r.source)}</pre>`:`<div class="empty-note">no source in this image</div>`}
      <div class="bar">callers <span class="count">${r.callers.length}</span></div>
      <div class="callers">${r.callers.length?r.callers.map(c=>`<div class="c">${esc(c.text)}<br><span>${esc(shortPath(c.path||c.ns))}:${c.line}</span></div>`).join(""):`<div class="empty-note">no caller among loaded namespaces</div>`}</div>`;
    el("dact").innerHTML=`<button type="button" class="go" id="use" title="put a call in the prompt">use</button>`;
    el("use").onclick=()=>{ closeDrawer(); insertAtCursor(`(${q} `); };
  }
}
function shortPath(p){ const s=String(p).split("/"); return s.length>4?"…/"+s.slice(-3).join("/"):p; }
function dedent(d){ return String(d||"").replace(/\n[ \t]+/g,"\n"); }
function shortArgs(a){ if(!a) return ""; const m=a.match(/\([^()]*\)/g); return m?m.map(c=>"["+c.replace(/^\(\S+\s?|\)$/g,"")+"]").join(" "):a; }

// ── a task's transcript: its .bl.org, rendered ──
async function openTranscript(id,refresh=false,push=true){
  const r=await ask("transcript",{task:id});
  if(!r){ return; }
  drawerStatus=r.status;
  const t=tileRows.find(x=>x.task===id)||{kept:[]};
  const foot=`<input id="say-text" placeholder="say, or ¶ note" aria-label="message for ${esc(id)}"><button type="button" class="ib" id="note-btn" title="note: read at the next step, starts nothing" aria-label="note">¶</button><button type="button" class="ib go" id="say-btn" title="say: starts a turn if idle" aria-label="say">▶</button>${r.status==="running"?`<button type="button" class="ib" id="stop-btn" title="stop the turn" aria-label="stop">■</button>`:""}`;
  const keep=el("dbody").scrollTop, atEnd=refresh&&el("dbody").scrollHeight-el("dbody").scrollTop-el("dbody").clientHeight<40;
  openDrawer("transcript",id,`${MARK[r.status]?.[0]||"○"} ${esc(id)}`,`${esc(r.status==="step-limit"?"needs you · step limit":r.status)}${origins[id]?` · from ${esc(curNs)}:${origins[id]}`:""}`,
    (t.kept.length?`<div class="kept-row">${t.kept.map(k=>`<button type="button" data-rerun="${esc(k)}">↻ ${esc(k)}</button>`).join("")}</div>`:"")+renderOrg(r.text), foot, push&&!refresh);
  el("dbody").scrollTop=refresh?(atEnd?1e9:keep):1e9;
  for(const b of el("dbody").querySelectorAll("[data-rerun]")) b.onclick=()=>evalForm(`(rerun ${JSON.stringify(id)} ${JSON.stringify(b.dataset.rerun)})`);
  const send=fn=>{ const v=el("say-text").value.trim(); if(!v) return; evalForm(`(${fn} ${JSON.stringify(id)} ${JSON.stringify(v)})`); el("say-text").value=""; setTimeout(()=>openTranscript(id,true),600); };
  el("say-btn").onclick=()=>send("say"); el("note-btn").onclick=()=>send("note");
  el("say-text").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); send(e.altKey?"note":"say"); } };
  el("stop-btn")?.addEventListener("click",()=>evalForm(`(stop! ${JSON.stringify(id)})`));
}
// Org as the harness writes it: headings are turns, src blocks are cells, `: `
// lines are results; a table (or a block of `a | b` rows) renders as a table.
function renderOrg(text){
  const L=text.split("\n"); let out="", i=0, para=[];
  const flush=()=>{ if(para.length){ out+=`<div class="doc-prose">${inline(para.join("\n"))}</div>`; para=[]; } };
  const table=rows=>{ const cells=rows.map(r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim())); const [h,...b]=cells.filter(r=>!r.every(c=>/^-+(\+-+)*$/.test(c))); return `<table class="org"><tr>${h.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${b.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`; };
  while(i<L.length){
    const l=L[i];
    if(/^#\+(title|property):/i.test(l)){ i++; continue; }
    if(/^\*+ /.test(l)){ flush(); const h=l.replace(/^\*+ /,""); const kind=h.split(/[ ·]/)[0]; out+=`<div class="bar">${kindMark(kind)} ${esc(h)}</div>`; i++; continue; }
    if(/^#\+begin_src/i.test(l)){ flush(); const b=[]; i++; while(i<L.length&&!/^#\+end_src/i.test(L[i])) b.push(L[i++]); i++; out+=`<pre class="code">${esc(b.join("\n"))}</pre>`; continue; }
    if(/^#\+RESULTS/i.test(l)){ flush(); const b=[]; i++; while(i<L.length&&(/^: ?/.test(L[i])||/^\s*\|/.test(L[i]))) b.push(L[i++]); const rows=b.filter(x=>/^\s*\|/.test(x)); out+=rows.length===b.length&&rows.length?table(rows):`<pre class="result">${esc(b.map(x=>x.replace(/^: ?/,"")).join("\n"))}</pre>`; continue; }
    if(/^#\+begin_(\w+)/i.test(l)){ flush(); const kind=/^#\+begin_(\w+)/i.exec(l)[1]; const b=[]; i++; while(i<L.length&&!/^#\+end_/i.test(L[i])) b.push(L[i++]); i++; const rows=b.filter(x=>x.includes("|")); out+=rows.length&&rows.length===b.filter(x=>x.trim()).length?table(rows.map(r=>"|"+r+"|")):`<pre class="result">${esc(b.join("\n"))}</pre>`; continue; }
    if(/^\s*\|/.test(l)){ flush(); const b=[]; while(i<L.length&&/^\s*\|/.test(L[i])) b.push(L[i++]); out+=table(b); continue; }
    if(!l.trim()){ flush(); i++; continue; }
    para.push(l); i++;
  }
  flush(); return out||`<div class="empty-note">empty</div>`;
}
function inline(t){ return esc(t).replace(/`([^`\n]+)`/g,'<code class="mono">$1</code>').replace(/(^|[\s(])[=~]([^=~\n]+?)[=~](?=[\s.,;:)]|$)/g,(m,a,b)=>`${a}<code class="mono">${b}</code>`); }
function kindMark(k){ return ({task:"◇",steer:"▶",note:"¶",eval:"λ",model:"✦",advice:"▲",keep:"↻",turn:"○"})[k]||"·"; }

// ── phone: the rail is a second page ──
el("tab-work").onclick=()=>{ document.body.classList.remove("show-rail"); el("tab-work").classList.add("on"); el("tab-rail").classList.remove("on"); view.focus(); };
el("tab-rail").onclick=()=>{ document.body.classList.add("show-rail"); el("tab-rail").classList.add("on"); el("tab-work").classList.remove("on"); };

markOrigins(); connect(); view.focus(); refreshState();
</script>
